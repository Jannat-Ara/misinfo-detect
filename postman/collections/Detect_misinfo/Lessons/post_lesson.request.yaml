body:
  type: json
  content: "{\r

    \    \"lessonNumber\": 12,\r

    \    \"title\": \"Final Challenge: Can You Spot the Fake?\",\r

    \    \"summary\": \"Put everything together. Use all your skills to separate real from fake.\",\r

    \    \"content\": [\r

    \      \"This is the final challenge. Each question mixes skills from earlier lessons: headlines, images, sources, authors, dates, deepfakes, statistics, and social media.\",\r

    \      \"Before you answer, run through your checklist: Who made this? When? What is the evidence? What do other trusted sources say?\"\r

    \    ],\r

    \    \"tips\": [\r

    \      \"Use SIFT on every question\",\r

    \      \"Look for the red flags you've learned\",\r

    \      \"Take your time; checking beats guessing\"\r

    \    ],\r

    \    \"questions\": [\r

    \      {\r

    \        \"type\": \"headline-compare\",\r

    \        \"prompt\": \"Which headline is more trustworthy?\",\r

    \        \"options\": [\r

    \          {\r

    \            \"id\": \"a\",\r

    \            \"text\": \"Riverton school board votes 5-2 to start classes 30 minutes later next fall\"\r

    \          },\r

    \          {\r

    \            \"id\": \"b\",\r

    \            \"text\": \"SHOCKING: Schools are secretly making kids sleep less, experts FURIOUS\"\r

    \          }\r

    \        ],\r

    \        \"correctAnswer\": \"a\",\r

    \        \"explanation\": \"Option A gives a specific vote, a group, and a date. Option B uses shock words, vague 'experts', and no facts.\"\r

    \      },\r

    \      {\r

    \        \"type\": \"multiple-choice\",\r

    \        \"prompt\": \"A photo shows a famous landmark covered in snow, captioned 'Freak blizzard this morning!' It's summer, and a reverse image search finds the photo from a winter 5 years ago. What is it?\",\r

    \        \"options\": [\r

    \          {\r

    \            \"id\": \"a\",\r

    \            \"text\": \"Real breaking news\"\r

    \          },\r

    \          {\r

    \            \"id\": \"b\",\r

    \            \"text\": \"An old photo shared out of context\"\r

    \          },\r

    \          {\r

    \            \"id\": \"c\",\r

    \            \"text\": \"A weather forecast\"\r

    \          },\r

    \          {\r

    \            \"id\": \"d\",\r

    \            \"text\": \"A trustworthy source\"\r

    \          }\r

    \        ],\r

    \        \"correctAnswer\": \"b\",\r

    \        \"explanation\": \"The photo is real but from 5 years ago. Pairing it with 'this morning' makes it misleading.\"\r

    \      },\r

    \      {\r

    \        \"type\": \"true-false\",\r

    \        \"prompt\": \"True or false: If several trusted news outlets independently report the same story, it is more likely to be accurate.\",\r

    \        \"options\": [\r

    \          {\r

    \            \"id\": \"a\",\r

    \            \"text\": \"True\"\r

    \          },\r

    \          {\r

    \            \"id\": \"b\",\r

    \            \"text\": \"False\"\r

    \          }\r

    \        ],\r

    \        \"correctAnswer\": \"a\",\r

    \        \"explanation\": \"Independent confirmation from multiple reliable sources is one of the best signs a story is accurate.\"\r

    \      },\r

    \      {\r

    \        \"type\": \"multiple-choice\",\r

    \        \"prompt\": \"A website called 'HealthTruthNow' claims a herbal tea cures diabetes. There is no author, no About page, and every article links to a shop selling the tea. What is the biggest problem?\",\r

    \        \"options\": [\r

    \          {\r

    \            \"id\": \"a\",\r

    \            \"text\": \"The website has too many articles\"\r

    \          },\r

    \          {\r

    \            \"id\": \"b\",\r

    \            \"text\": \"No accountability plus a clear money motive\"\r

    \          },\r

    \          {\r

    \            \"id\": \"c\",\r

    \            \"text\": \"The tea might taste bad\"\r

    \          },\r

    \          {\r

    \            \"id\": \"d\",\r

    \            \"text\": \"There is no problem\"\r

    \          }\r

    \        ],\r

    \        \"correctAnswer\": \"b\",\r

    \        \"explanation\": \"No author or About page means no accountability, and the site profits if you believe the claim.\"\r

    \      },\r

    \      {\r

    \        \"type\": \"multiple-choice\",\r

    \        \"prompt\": \"A post says 'Crime DOUBLED in our town this year!' The police report shows 2 incidents last year and 4 this year. What is the best description of the post?\",\r

    \        \"options\": [\r

    \          {\r

    \            \"id\": \"a\",\r

    \            \"text\": \"Accurate and fair\"\r

    \          },\r

    \          {\r

    \            \"id\": \"b\",\r

    \            \"text\": \"Technically true but misleading without the real numbers\"\r

    \          },\r

    \          {\r

    \            \"id\": \"c\",\r

    \            \"text\": \"Completely made up\"\r

    \          },\r

    \          {\r

    \            \"id\": \"d\",\r

    \            \"text\": \"A deepfake\"\r

    \          }\r

    \        ],\r

    \        \"correctAnswer\": \"b\",\r

    \        \"explanation\": \"Going from 2 to 4 is a doubling, but the small numbers matter. Leaving them out makes it sound much scarier than it is.\"\r

    \      },\r

    \      {\r

    \        \"type\": \"multiple-choice\",\r

    \        \"prompt\": \"Your group chat shares a screenshot: 'Campus closed Friday due to gas leak!' There's no link and no date. What should you do?\",\r

    \        \"options\": [\r

    \          {\r

    \            \"id\": \"a\",\r

    \            \"text\": \"Stay home Friday\"\r

    \          },\r

    \          {\r

    \            \"id\": \"b\",\r

    \            \"text\": \"Check the university's official website, email, or alert system\"\r

    \          },\r

    \          {\r

    \            \"id\": \"c\",\r

    \            \"text\": \"Forward it to more group chats\"\r

    \          },\r

    \          {\r

    \            \"id\": \"d\",\r

    \            \"text\": \"Trust it because your friends shared it\"\r

    \          }\r

    \        ],\r

    \        \"correctAnswer\": \"b\",\r

    \        \"explanation\": \"A screenshot with no link or date can't be verified. Real campus closures come through official channels.\"\r

    \      },\r

    \      {\r

    \        \"type\": \"headline-compare\",\r

    \        \"prompt\": \"Last one! Which post is more trustworthy?\",\r

    \        \"options\": [\r

    \          {\r

    \            \"id\": \"a\",\r

    \            \"text\": \"Anonymous account: 'My cousin's friend says the water supply is POISONED. Spread the word!!'\"\r

    \          },\r

    \          {\r

    \            \"id\": \"b\",\r

    \            \"text\": \"City Water Department: 'Routine testing completed Oct 3. Results meet all safety standards. Full report linked.'\"\r

    \          }\r

    \        ],\r

    \        \"correctAnswer\": \"b\",\r

    \        \"explanation\": \"Option B comes from the responsible official source, includes a date, and links evidence. Option A is a second-hand rumor with urgent language.\"\r

    \      }\r

    \    ]\r

    \  }"
order: 3000
